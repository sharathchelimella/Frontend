<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        h1{
            color: #333;
        }
        .container{
            border: 1px,solid,black;
            padding: 10px;
            margin-bottom: 10px;

        }
        .flex-contaner{
            display: flex;
            margin-bottom: 10px;
        }
        circle1{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin: 5px;


        }
       
    </style>
    
</head>
<body>
    <h1>Flexbox Masterclass Demo</h1>
    <div class="container">
        <div class="flex-contaner">
            <h2>1.Default Flex(row)</h2>
            <div class="circle1">1</div>
            <div class="circle2">2</div>
            <div class="circle3">3</div>
            <div class="circle4">4</div>
            <div class="circle5">5</div>
        </div>
    </div>
    <div class="container2">
        <h2>2.Flex Direction: Column</h2>
        <div class="circle">1</div>
        <div class="circle">2</div>
        <div class="circle">3</div>
        <div class="circle">4</div>
        <div class="circle">5</div>        
    </div>
    <div class="container3">
        <h2>3.Justyfy Content: Space-Between</h2>
        <div class="circle1">1</div>
        <div class="circle2">2</div>
        <div class="circle3">3</div>
        <div class="circle4">4</div>
        <div class="circle5">5</div>        
    </div>
    <div class="container4">
        <h2>4.Align Center</h2>
        <div class="circle1">1</div>
        <div class="circle2">2</div>
        <div class="circle3">3</div>
        <div class="circle4">4</div>
        <div class="circle5">5</div>        
    </div>
    <div class="container5">
        <h2>5.Flex Wrap</h2>
        <div class="circle1">1</div>
        <div class="circle2">2</div>
        <div class="circle3">3</div>
        <div class="circle4">4</div>
        <div class="circle5">5</div>  
        <div class="circle1">6</div>
        <div class="circle2">7</div>
        <div class="circle3">8</div>
        <div class="circle4">9</div>
        <div class="circle5">10</div>        
    </div>
       <div class="container6">
        <h2>6.Align Content: Space-Around(with Wrap)</h2>
        <div class="circle1">1</div>
        <div class="circle2">2</div>
        <div class="circle3">3</div>
        <div class="circle4">4</div>
        <div class="circle5">5</div>        
    </div>
       <div class="container7">
        <h2>7.Align Center</h2>
        <div class="circle1">1</div>
        <div class="circle2">2</div>
        <div class="circle3">3</div>
        <div class="circle4">4</div>
        <div class="circle5">5</div>        
    </div>
</body>
</html>
